<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | PowerUp Analytics</title>
    <link rel="stylesheet" href="css/landing.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo"><a href="index.html">PowerUp Analytics</a></div>
        </header>

        <main>
            <div class="login-container">
                <h2>Accede a tu Panel</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="button" class="btn btn-primary btn-large" onclick="fakeLogin()">Acceder</button>
                </form>
            </div>
        </main>
    </div>
    
    <script>
        function fakeLogin() {
            // En una app real, aquí harías un fetch() a tu backend
            // y si tiene éxito, rediriges.
            console.log("Simulando inicio de sesión...");
            // Redirige al panel de la aplicación
            window.location.href = "../frontend/dashboard.html";
        }
    </script>
</body>
</html>
