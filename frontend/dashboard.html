<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Dashboard | ControlFlow</title>
    <link rel="stylesheet" href="css/app.css?v=200">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h3>ControlFlow</h3>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active" data-view="wellness"><a data-i18n="nav.wellness">Bienestar</a></li>
                <li class="nav-item" data-view="activities"><a data-i18n="nav.activities">Actividades</a></li>
                <li class="nav-item" data-view="analysis"><a data-i18n="nav.analysis">Análisis</a></li>
            </ul>
            <div class="sidebar-footer">
                <ul class="nav-menu">
                     <li class="nav-item" data-view="settings"><a data-i18n="nav.settings">Configuración</a></li>
                </ul>
                <a href="#" id="logout-btn" data-i18n="nav.logout">Cerrar Sesión</a>
            </div>
        </nav>

        <main class="main-content">
            <header class="app-header">
                <div class="controls">
                    <label for="athlete-select" data-i18n="header.athlete">Atleta:</label>
                    <select id="athlete-select">
                        <option data-i18n="header.loading">Cargando...</option>
                    </select>
                </div>
                <div class="header-actions">
                    <!-- Language Selector -->
                    <div class="language-selector">
                        <button class="language-btn active" data-lang="es">ES</button>
                        <button class="language-btn" data-lang="en">EN</button>
                    </div>

                    <!-- Theme Toggle -->
                    <button class="theme-toggle" id="theme-toggle" title="Cambiar tema">
                        <span class="theme-icon sun">☀️</span>
                        <span class="theme-icon moon">🌙</span>
                    </button>

                    <!-- User Profile -->
                    <div class="user-profile">
                        <span id="user-email">Cargando...</span>
                    </div>
                </div>
            </header>

            <div class="view-container" id="app-view">
                </div>
        </main>
    </div>

    <script src="js/firebase-init.js?v=200" type="module"></script>
    <script src="js/initUI.js?v=200" type="module"></script>
    <script src="js/apiService.js?v=200" type="module"></script>
    <script src="js/charts.js?v=200" type="module"></script>
    <script src="js/components/WellnessPanel.js?v=200" type="module"></script>
    <script src="js/components/ActivityFeed.js?v=200" type="module"></script>
    <script src="js/components/SettingsPanel.js?v=200" type="module"></script>
    <script src="js/app.js?v=200" type="module"></script>
</body>
</html>
